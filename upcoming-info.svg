<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 405" width="600" height="405">
  <rect width="100%" height="100%" fill="#F5F5F5" rx="8" stroke="#D6D6D6" stroke-width="1.5"/>
  <text x="20" y="35" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#087E8B">Lesson 01 (Mon, 8/24) - Class Overview</text>
<text x="20" y="60" font-family="system-ui, sans-serif" font-size="15" xml:space="preserve" font-weight="bold" fill="#3C3C3C">Reading:</text>
<text x="20" y="79" font-family="system-ui, sans-serif" font-size="15" xml:space="preserve" fill="#3C3C3C">Syllabus</text>
<line x1="20" y1="94" x2="580" y2="94" stroke="#D6D6D6" stroke-width="1.5"/>
<text x="20" y="110" font-family="system-ui, sans-serif" font-size="15" xml:space="preserve" font-weight="bold" fill="#3C3C3C">Learning Objectives:</text>
<text x="20" y="129" font-family="system-ui, sans-serif" font-size="15" xml:space="preserve" fill="#3C3C3C">   • * Explain the structure of this course and identify the core concepts</text>
<text x="20" y="148" font-family="system-ui, sans-serif" font-size="15" xml:space="preserve" fill="#3C3C3C">      (evolution definition, importance of scale, process vs pattern)</text>
<text x="20" y="167" font-family="system-ui, sans-serif" font-size="15" xml:space="preserve" fill="#3C3C3C">   • * Identify key components and organelles in cells critical to understanding</text>
<text x="20" y="186" font-family="system-ui, sans-serif" font-size="15" xml:space="preserve" fill="#3C3C3C">      evolution (DNA, nucleus, ER, Golgi apparatus, mitochondria, chloroplasts),</text>
<text x="20" y="205" font-family="system-ui, sans-serif" font-size="15" xml:space="preserve" fill="#3C3C3C">      and state their purposes</text>
<text x="20" y="224" font-family="system-ui, sans-serif" font-size="15" xml:space="preserve" fill="#3C3C3C">   • * Define the central dogma of biology. Explain how cells can turn genetic</text>
<text x="20" y="243" font-family="system-ui, sans-serif" font-size="15" xml:space="preserve" fill="#3C3C3C">      material into traits, and the molecules involved in that process.</text>
<text x="20" y="262" font-family="system-ui, sans-serif" font-size="15" xml:space="preserve" fill="#3C3C3C">   • * Define the basic terms used to discuss genetics (see first-day notes).</text>
<text x="20" y="281" font-family="system-ui, sans-serif" font-size="15" xml:space="preserve" fill="#3C3C3C">   • * Define the basic terms used to discuss taxonomy and phylogenetics (see</text>
<text x="20" y="300" font-family="system-ui, sans-serif" font-size="15" xml:space="preserve" fill="#3C3C3C">      first-day notes).</text>
<text x="20" y="319" font-family="system-ui, sans-serif" font-size="15" xml:space="preserve" fill="#3C3C3C">   • * Identify the 12 focal species that will be used in this class from their</text>
<text x="20" y="338" font-family="system-ui, sans-serif" font-size="15" xml:space="preserve" fill="#3C3C3C">      latin names (see first-day notes).</text>
<text x="20" y="361" font-family="system-ui, sans-serif" font-size="12" font-style="italic" fill="#555555">* starred learning objectives are practiced in class. Unstarred learning objectives are in the reading and will be discussed in class.</text>
<text x="20" y="386" font-family="system-ui, sans-serif" font-size="14" font-weight="600" fill="#8F0005">Next Exam: Exam 1 - Testing Center (9/14-9/15)</text>
</svg>